name: Android CI Build

# 触发条件：当推送代码到 main 分支，或者手动点击运行按钮时触发
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 配置 Java 21 环境 (当前项目必需)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 安装指定版本的 Gradle 9.3.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
          validate-wrappers: false

      # 创建环境变量空文件 (防止报错)
      - name: Create empty .env if missing
        run: touch .env

      # ----------------------------------------------------
      # 智能处理签名文件：从 GitHub Secrets 中读取 Base64 编码的签名
      # ----------------------------------------------------
      - name: Decode Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Found keystore in GitHub Secrets, decoding..."
            echo "$KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ -f debug.keystore ]; then
            echo "Using existing debug.keystore from repository."
          else
            echo "No secret found and no existing keystore. Generating a temporary one..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
          fi
          
          # 自动为 Release 变体生成一个临时的签名文件 (如果不存在)
          if [ ! -f my-upload-key.jks ]; then
            echo "Generating temporary release keystore..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Release"
          fi

      # 使用全局 Gradle 执行打包命令 (打包所有变体 Debug + Release)
      - name: Build All APK Variants
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
        run: gradle assemble --stacktrace --no-daemon --no-configuration-cache

      # 上传生成的 APK 文件
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: app/build/outputs/apk/**/*.apk

      # 自动发布所有的变体安装包到 Release 页面
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.4.${{ github.run_number }}"
          name: "app-release v1.4.${{ github.run_number }}"
          files: app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
